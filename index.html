<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NetworkScan.AI — Coming Soon</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: #1e2d4a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .container {
      text-align: center;
      max-width: 560px;
      width: 100%;
    }

    .logo-wrap {
      margin-bottom: 2.5rem;
    }

    .logo-wrap img {
      width: 180px;
      height: 180px;
      object-fit: contain;
      border-radius: 24px;
      display: block;
      margin: 0 auto;
    }

    .brand {
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #e8a830;
      margin-bottom: 1.25rem;
    }

    .headline {
      font-size: clamp(2.4rem, 6vw, 3.6rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
      color: #ffffff;
      margin-bottom: 1.25rem;
    }

    .headline span {
      color: #e8a830;
    }

    .tagline {
      font-size: 1.1rem;
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 2.75rem;
    }

    .divider {
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, #e8a830, rgba(232,168,48,0.2));
      border-radius: 2px;
      margin: 0 auto 2.75rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      border: 1px solid rgba(232, 168, 48, 0.35);
      border-radius: 100px;
      padding: 0.5rem 1.25rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: #e8a830;
      letter-spacing: 0.04em;
    }

    .badge::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #e8a830;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.75); }
    }

    .domain {
      margin-top: 3rem;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.3);
      letter-spacing: 0.08em;
    }

    @media (max-width: 480px) {
      .logo-wrap img {
        width: 140px;
        height: 140px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-wrap">
      <img src="logo.jpg" alt="NetworkScan.AI Logo" />
    </div>

    <p class="brand">NetworkScan.AI</p>

    <h1 class="headline">Coming <span>Soon</span></h1>

    <div class="divider"></div>

    <p class="tagline">Cybersecurity visibility for every business.<br>Know what's on your network before attackers do.</p>

    <div class="badge">Currently in development</div>

    <p class="domain">networkscan.ai</p>
  </div>
</body>
</html>
